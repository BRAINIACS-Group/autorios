[build-system]
requires = ["hatchling","hatch-vcs","hatch-pyinstaller"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorios"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.pyinstaller]
require-runtime-dependencies = true
scriptname="src/autorios/__main__.py"
name="autorios"
loglevel="DEBUG"
add-data=["src/autorios/data:autorios/data"]
flags=["--onedir"]

[tool.hatch.build.hooks.vcs]
version-file = "src/autorios/_version.py"

[tool.hatch.version]
source="vcs"

[project.scripts]
autorios = "autorios:__main__"
autorios-gui= "autorios:gui"

[project]
name = "autorios"
dynamic =["version"]
authors = [
  { name="Jan Hinrichsen", email="j.hinrichsen95@gmail.com" },
]
description = "Automate the TA Instruments Trios software and Datalogger (ARG2)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
  "click",
  "click_logging",
  "pynput",
  "pydantic==2.13.2",
  "PyAutoGUI==0.9.54",
  "pywinauto==0.6.6",
  "PySide6",
  "pyyaml",
  "pywin32",
  "platformdirs"
]