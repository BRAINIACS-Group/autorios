# "B(?P<batchId>[0-9p\+]+)"
  #  "-S(?P<specimenId>[0-9p\+]+)"
  #  "-P(?P<protocolId>[0-9p\+]+)(?P<protocolPart>[a-zp]+)"
  #  "-ALG(?P<algRatio>[0-9p\+]+)"
  #  "-Cell(?P<cellRatio>[0-9p\+]+)"
  #  "(-CaP(?P<capRatio>[0-9p\+]+))?"
  #  "(-PH(?P<algType>[0-9p\+]+))?"
  #  "(-CaCl(?P<caClRatio>[0-9p\+]+))?"
  #  "(-(?P<process>(printed)|(molded)))?",
name: ALG-Cell
fields:
-  B<batchId:int>
-  S<specimenId:int>
-  <protocol:protocol>
-  ALG<algRatio:float>
-  pattern: Cell<cellRatio:float>
-  pattern: CaP<capRatio:float>
   optional: True
-  pattern: PH<algType:float>
   optional: True
-  pattern: CaCl<caClRatio:float>
   optional: True
-  pattern: <process:selection(printed|molded)>
   optional: True
   
examples:
-  B1-S4-P3-ALG0p2-Cell0p8-CaP0p05-PH176-CaCl0p1-printed
-  B1-S1-P3-ALG0p2-Cell0p8-CaP0p05-PH176-CaCl0p1-molded
