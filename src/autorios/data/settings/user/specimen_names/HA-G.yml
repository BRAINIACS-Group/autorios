# "-P(?P<protocolId>[0-9p\+]+)(?P<protocolPart>[a-zp]+)"
# "-HAG(?P<hagRatio>[0-9p]+)"
# "-M(?P<medium>[A-Za-z]+)"
# "(-(?P<process>(printed)|(molded)))?"
# "(-temp(?P<temp>[0-9\+]+))?",

name: HA-G
fields:
-  B<batchId:int>
-  S<specimenId:int>
-  <protocol:protocol>
-  HAG<hagRatio:float>
-  M<medium:str>
-  pattern: <process:selection(printed|molded)>
   optional: True
-  pattern: temp<temp:float>
   optional: True
   
examples:
-  B1-S1-P2-HAG300-MDPBS-molded
-  B1-S1-P2-HAG150-MDPBS-molded
