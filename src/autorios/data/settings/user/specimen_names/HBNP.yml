name: HBNP
pattern: "HBNP_R_{date}_{operator}_{fields}"
fields:
- B<BrainId:int>
- S<SpecimenId:int>
- R<Region:str>
- P<Protocol:int>  #special field type <protocolId><protocolPart>
- PN<pathologynumber:str>  #String for now, might make this into a special field?
- pattern:  F<fluid:str>
  optional: True
- pattern:  D<diameter:int>
  optional: True
examples:
- B32-S1-RWM-P2-PN677p25-FACSF-D6
- B20-P2-PNxxxxp24-FoACSF
- B13-P2-PN650p24
