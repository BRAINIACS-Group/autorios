#This file contains the parameters of the protocols being used currently

#In case of missing protocol, please use a copy of this file
#and change the values according to your protocol
#Please give a distinctive and suitable name

#Please pay attention to the indentation, "2 spaces"

#  key:value pair

---
#local Yaml variables
height_tension :     &height_tension 1.15*{specimen.height}
height_compression : &height_compression 0.85*{specimen.height}
#use a strain rate of 8e-3 1/s
velocity_cyclic:      &velocity_cyclic 0.008*{specimen.height}
#use a strain rate of 2e-2 1/s
velocity_relaxation : &velocity_relaxation 0.02*{specimen.height}

protocols :

#protocol1
- #file path to Trios procedure file, either relative to this file
  #or absolute 
  procedure_file_path : procedure_files/HBE_Protokoll_with_frequency_2a_red.tprc
  # this will cause the datalogger to be started after the frequency has
  # finished, only works if this is the first step
  has_frequency_sweep : True
  
  #Trios device settings
  device_settings :
    velocity :      *velocity_cyclic
    fine_velocity : *velocity_cyclic


  steps:
    - ["1: Oscillation Frequency","wait_for_temperature",None]
    - ["2: Conditioning Sample Loading","gap", *height_compression]
    - ["2: Conditioning Sample Loading","velocity", *velocity_cyclic]

- procedure_file_path : procedure_files/HBE_Protokoll2b_red.tprc
  has_frequency_sweep : False
  
  device_settings :
    #use a strain rate of 2e-2 1/s
    velocity : *velocity_relaxation
    fine_velocity : *velocity_relaxation

  steps :
    - ["1: Conditioning Sample Loading","gap",      *height_compression]
    - ["1: Conditioning Sample Loading","velocity", *velocity_relaxation]
