#This file contains the parameters of the protocols being used currently

#In case of missing protocol, please use a copy of this file
#and change the values according to your protocol
#Please give a distinctive and suitable name

#Please pay attention to the indentation, "2 spaces"

#  key:value pair

---
#local Yaml variables: You can use mathematical expression
#and (currently) the specimen height
height_compression : &height_compression 0.85*{specimen.height}
  
protocols :

#protocol1
- #file path to Trios procedure file, either relative to this file
  #or absolute 
  procedure_file_path : procedure_files/HBE_Protokoll3a.tprc
  # this will cause the datalogger to be started after the frequency has
  # finished, only works if this is the first step
  has_frequency_sweep : False
  
  #Trios device settings
  device_settings : 
    #use a strain rate of 1e-2 1/s
    velocity : 0.01*{specimen.height}
    fine_velocity : 0.01*{specimen.height}

  steps:
    - ["1: Conditioning Sample Loading","gap", *height_compression]
    - ["3: Conditioning Sample Loading","gap", *height_compression]
    - ["5: Conditioning Sample Loading","gap", *height_compression]
    - ["7: Conditioning Sample Loading","gap", *height_compression]

