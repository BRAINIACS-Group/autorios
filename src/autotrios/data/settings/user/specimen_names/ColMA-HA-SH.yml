# "B(?P<batchId>[0-9p\+]+)"
# "-S(?P<specimenId>[0-9p\+]+)"
# "-P(?P<protocolId>[0-9p\+]+)(?P<protocolPart>[a-zp]+)"
# "-ColMA(?P<colMaRatio>[0-9p]+)"
# "-HASH(?P<hashRatio>[0-9p]+)"
# "-D(?P<daysInVitro>[0-9]+)"
# "-M(?P<medium>[A-Za-z]+)"
# "(-(?P<process>(printed)|(molded)))?"
# "(-temp(?P<temp>[0-9\+]+))?",

name: ColMA-HA-SH
fields:
-  B<batchId:int>
-  S<specimenId:int>
-  <protocol:protocol>
-  ColMA<colMaRatio:float>
-  HASH<hashRatio:float>
-  D<daysInVitro:int>
-  M<medium:str>
-  pattern: <process:selection(printed|molded)>
   optional: True
-  pattern: temp<temp:float>
   optional: True
   
examples:
-  B1-S1-P3-ColMA2p5-HASH0p0-D3-MDMEMPS-molded
-  B1-S1-P3-ColMA2p1-HASH0p0-D3-MDMEMPS-molded
