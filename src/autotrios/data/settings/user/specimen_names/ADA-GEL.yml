name: ADA-GEL
fields:
-  B<batchId:int>
-  S<specimenId:int>
-  <protocol:protocol>
-  ADA<adaRatio:float>
-  GEL<gelRatio:float>
-  pattern: PH<algType:float>
   optional: False
-  pattern: DO<oxidation:float>
   optional: False
-  pattern: CaCl<caClRatio:float>
   optional: False
-  pattern: mTG<mtgRatio:float>
   optional: False
-  pattern: <process:selection(printed|molded)>
   optional: True
-  pattern: temp<temp:float>
   optional: True
   
examples:
-  B1-S1-P2-ADA0p025-GEL0p0375-PH163-DO0p25.txt"
-  B1-S3-P2-ADA0p025-GEL0p0375-PH163-DO0p06-printed.txt"

